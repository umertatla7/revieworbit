name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  production-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
      - run: >-
          docker run --rm
          -e ROOT_DOMAIN=revieworbit.tech
          -e WEB_DOMAIN=app.revieworbit.tech
          -e API_DOMAIN=api.revieworbit.tech
          -e TLS_EMAIL=admin@revieworbit.tech
          -v "$PWD/infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose --env-file .env.production -f docker-compose.production.yml build api nginx web
      - run: docker compose --env-file .env.production -f docker-compose.production.yml up --wait postgres redis
      - if: always()
        run: docker compose --env-file .env.production -f docker-compose.production.yml down --volumes
