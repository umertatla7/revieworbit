name: revieworbit

x-api: &api
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile
  env_file:
    - .env.production
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - api_storage:/var/www/html/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    <<: *api
    command:
      - sh
      - -c
      - >-
        mkdir -p storage/app/private storage/framework/cache storage/framework/sessions
        storage/framework/views storage/logs &&
        chown -R www-data:www-data storage bootstrap/cache &&
        exec php-fpm
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *api
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=webhooks,integrations,messaging,media,analytics,default
      - --sleep=1
      - --tries=3
      - --timeout=120
      - --max-time=3600

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  pgadmin:
    image: dpage/pgadmin4:9.17
    env_file:
      - .env.production
    environment:
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'Authorised Breviews administrators only'"
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      nginx:
        condition: service_healthy

volumes:
  api_storage:
  postgres_data:
  redis_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
